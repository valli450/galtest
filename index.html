<!DOCTYPE html>
<html lang="ru">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Быть Ван Гогом</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0806;color:#fff;font-family:Georgia,serif;height:100vh;width:100vw;overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#bg{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:0;pointer-events:none}
#intro{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:100;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px;background:#0a0806;transition:opacity 1.5s}
#intro.out{opacity:0;pointer-events:none}
#intro img{width:90px;height:90px;border-radius:50%;object-fit:cover;margin-bottom:20px;opacity:0;animation:fi 1s .5s forwards}
#intro h1{font-size:36px;font-weight:300;margin-bottom:10px;opacity:0;animation:fi 1s 1s forwards}
#intro h1 span{color:#c4966a}
#intro p{font-size:13px;color:rgba(255,255,255,.3);max-width:400px;line-height:1.8;opacity:0;animation:fi 1s 1.5s forwards}
@keyframes fi{to{opacity:1}}
#screen{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:1;visibility:hidden;opacity:0;transition:opacity .8s;display:flex;align-items:center;justify-content:center}
#screen.on{visibility:visible;opacity:1}
#ctr{text-align:center;position:relative;z-index:3;transition:opacity .6s,transform .6s;pointer-events:none}
#ctr.out{opacity:0;transform:scale(.9)}
#ctr .l{font-size:9px;letter-spacing:4px;text-transform:uppercase;color:#c4966a;margin-bottom:8px;opacity:.5}
#ctr h2{font-size:26px;font-weight:300;margin-bottom:6px}
#ctr .pd{font-size:10px;color:rgba(255,255,255,.2);letter-spacing:2px;margin-bottom:14px}
#ctr .d{font-size:12px;line-height:1.8;color:rgba(255,255,255,.25);max-width:340px;margin:0 auto}
.ob{position:absolute;border-radius:3px;overflow:hidden;pointer-events:none;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,.4);filter:brightness(.35) saturate(.25);transition:filter .8s,opacity .8s}
.ob img{width:100%;height:100%;object-fit:cover;display:block}
.ob.v{visibility:hidden}
.ob.done{filter:brightness(.6) saturate(.6)!important;pointer-events:auto!important}
.fly{position:fixed;z-index:10;pointer-events:none;border-radius:3px;overflow:hidden;box-shadow:0 25px 60px rgba(0,0,0,.6);will-change:left,top,width,height,filter}
.fly img{width:100%;height:100%;object-fit:cover;display:block}
#h{position:fixed;top:20px;left:32px;right:32px;z-index:20;display:flex;justify-content:space-between;align-items:center;pointer-events:none;mix-blend-mode:difference}
#h>*{pointer-events:auto}#h .b{font-size:9px;letter-spacing:4px;text-transform:uppercase;color:#fff;opacity:.4}
#h .b span{color:#c4966a}#h .c{font-size:9px;color:rgba(255,255,255,.12);letter-spacing:2px}
#nb{position:fixed;z-index:99999;bottom:120px;right:16px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(196,149,106,.5);background:rgba(196,149,106,.15);color:rgba(196,149,106,.9);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:1}
#next{position:fixed;z-index:99998;top:80px;right:24px;display:none;border:none;background:transparent;color:rgba(196,149,106,.6);font-size:9px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;pointer-events:auto;padding:6px 12px;transition:color .3s;font-family:Georgia,serif}
#next:hover{color:rgba(196,149,106,1)}
@media(max-width:767px){
  #h{padding:12px 16px}#h .b{font-size:8px}
  .fly{max-width:92vw!important;max-height:35vh!important;border-radius:2px}
  #ctr h2{font-size:18px}#ctr .d{font-size:10px}
  #hc{font-size:8px}
  #next{top:auto;bottom:60px;right:16px;font-size:8px}
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="h"><div class="b">Быть <span>Ван Гогом</span></div><div class="c" id="hc">I / VI</div></div>
<div id="intro"><img src="van-gogh-images/2-self-portrait.jpg"><h1>Быть <span>Ван Гогом</span></h1><p>Тысячи писем брату Тео.</p></div>
<div id="screen"><div id="ctr"><div class="l" id="cl"></div><h2 id="cn"></h2><div class="pd" id="cpd"></div><div class="d" id="cd"></div></div></div>
<div class="fly" id="f1"></div><div class="fly" id="f2"></div>
<button id="nb" onclick="nbClick()">→</button>
<button id="next" onclick="nextStage()">Следующий этап →</button>

<script>
const D=[
{nm:'Голландия',pd:'Нюэнен · 1880–1885',desc:'Ван Гог живёт с родителями в Нюэнене. Пишет крестьян и ткачей. Тёмная палитра — земляные тона. Отец умирает в марте 1885. Главная работа: «Едоки картофеля».',
 P:[{i:'1-potato-eaters.jpg',n:'Шахтёры',y:'1880–1881',d:'карандаш, бумага',loc:'Van Gogh Museum, Amsterdam',s:'—',
   l:'Линька для птиц — время, когда они меняют перья, — для нас, людей, то же самое, что несчастье или трудные времена. Можно остаться в этом периоде линьки, а можно выйти из него обновлённым. Но главное — не переставать работать. Даже когда всё внутри кричит, что ты не на своём месте.'},
  {i:'2-self-portrait.jpg',n:'Печаль',y:'1882',d:'карандаш, бумага',loc:'Van Gogh Museum, Amsterdam',s:'—',
   l:'Этой зимой я встретил беременную женщину, брошенную тем, чьего ребёнка она носила. Она бродила по улицам в мороз. Я взял её как модель и работал с ней всю зиму. Я не мог платить ей полную ставку, но я делил с ней свой хлеб. Так я сохранил её и её ребёнка от голода и холода.'},
  {i:'3-irises.jpg',n:'Пляж Схевенинген',y:'1882',d:'холст, масло',loc:'Van Gogh Museum, Amsterdam',s:'—',
   l:'Мове упрекает меня за слова «я художник». Но я их не возьму назад. Эти слова означают: я ищу, я преследую, моё сердце в этом. Это противоположно словам «я уже знаю, я уже нашёл». Искать, никогда не находя полностью — в этом суть. Всё, что я делаю, я делаю с натуры.'},
  {i:'4-bedroom.jpg',n:'Ткач',y:'1884',d:'холст, масло',loc:'Van Gogh Museum, Amsterdam',s:'—',
   l:'Я изучаю ткачей всё время, что я здесь. Сделал уже три акварели. Этих людей трудно рисовать — в маленьких комнатах невозможно отойти достаточно далеко, чтобы зарисовать станок. Поэтому попытки обычно не удаются. Очень мрачно — ткачи очень бедны. Я хочу понять эту жизнь изнутри. Я продолжаю работать, потому что работа — единственное, что держит меня в этом мире.'},
  {i:'5-church.jpg',n:'Едоки картофеля',y:'апрель–май 1885',d:'холст, масло, 82 × 114 см',loc:'Van Gogh Museum, Amsterdam',s:'82×114',
   l:'Я хотел бы отправить тебе картину «Едоков картофеля» к этому дню, но она ещё не совсем готова. Хотя я напишу её быстро и в основном по памяти, этому предшествовала целая зима этюдов голов и рук. Это была formidable fight, но я полон энтузиазма. Я хочу показать людей, которые едят свой хлеб, добытый трудом.'},
  {i:'6-starry-night.jpg',n:'Библия отца',y:'октябрь 1885',d:'холст, масло, 42 × 35 см',loc:'Van Gogh Museum, Amsterdam',s:'42×35',
   l:'Моя палитра оттаивает. Я сохраняю из природы последовательность и правильное расположение тонов. Я изучаю натуру, чтобы не делать глупостей, оставаться разумным. Но мне не важно, совпадают ли мои цвета в точности — лишь бы они хорошо выглядели на холсте, как они выглядят в жизни. Я продолжаю работать, потому что работа — единственное, что держит меня в этом мире.'}]},
{nm:'Антверпен',pd:'Антверпен · 1885–1886',desc:'Ван Гог переезжает в Антверпен, поступает в Академию. Открывает японские гравюры, коллекционирует их. Изучает Рубенса. Палитра начинает светлеть. В феврале 1886 внезапно уезжает в Париж.',
 P:[{i:'17-skull.jpg',n:'Череп курильщика',y:'1885–1886',d:'холст, масло, 41 × 33 см',loc:'Van Gogh Museum, Amsterdam',s:'41×33',
   l:'Есть что-то особенное в самой идее, что нужно решиться и нырнуть. Я беру минимум сорок подрамников одного размера — как те этюды голов. Нет ничего более верного, чем то, что я попытаюсь узнать больше. Особенно обнажённую натуру. Если я смогу — это будет шаг вперёд. Ничего не может быть вернее.'},
  {i:'38-congregation.jpg',n:'Церковь в Нюэнене',y:'1884–1885',d:'холст, масло',loc:'Van Gogh Museum, Amsterdam',s:'—',
   l:'На этой неделе я надеюсь отправить тебе маленький ящик с одной картиной — «Хижина». Я планирую написать её ещё раз. Меня это очень поразило — эти две хижины, наполовину разрушенные под одной соломенной крышей. Они напомнили мне пару изношенных стариков, которые поддерживают друг друга. Я продолжаю работать, потому что работа — единственное, что держит меня в этом мире.'},
  {i:'18-nature-morte-bible.jpg',n:'Библия и романы',y:'1885',d:'холст, масло, 42 × 35 см',loc:'Van Gogh Museum, Amsterdam',s:'42×35',
   l:'Я только что прочёл несколько книг в стиле «Воспоминаний» Жигу. Нашёл там очень интересные вещи о художниках тех дней. Это даёт мне уверенность, что я не ошибся в подходе к натуре и технике живописи. Хотя я свободно признаю, что должен и буду меняться. Всё впереди. Я продолжаю работать, потому что работа — единственное, что держит меня в этом мире.'},
  {i:'19-head-woman.jpg',n:'Голова крестьянки',y:'1885',d:'холст, масло, 29 × 38 см',loc:'Van Gogh Museum, Amsterdam',s:'29×38',
   l:'Эти головы, что у тебя — среди них должны быть хорошие, я почти уверен. Ну что ж — вперёд. Думаю, эта зима не будет скучной. Я всё ещё пишу крестьян. Но мне уже тесно. Чувствую, что скоро всё изменится. Я хочу большего. Я хочу цвета. Я продолжаю работать, потому что работа — единственное, что держит меня в этом мире.'},
  {i:'40-ginger-jar.jpg',n:'Имбирная ваза',y:'1885',d:'холст, масло',loc:'Van Gogh Museum, Amsterdam',s:'—',
   l:'На этой неделе я был в Амстердаме. Почти не было времени ни на что, кроме музея. Был там три дня, вернулся в четверг. Результат: я очень рад, что поехал, чего бы это ни стоило. Я столько раз откладывал — но это намного лучше. Я получаю слишком много для своей работы.'},
  {i:'37-weaver-interior.jpg',n:'Дом ткача',y:'май 1885',d:'холст, масло, 66 × 79 см',loc:'Van Gogh Museum, Amsterdam',s:'66×79',
   l:'Старая хижина под красным вечерним небом — я называю их «человеческие гнёзда». В них есть что-то родное, укрывающее. В этом доме два отдельных жилища с одним дымоходом. Такие дома тогда уже исчезали. Четыре года спустя, во Франции, я снова вернусь к этой теме — но совсем по-другому. Я продолжаю работать, потому что работа — единственное, что держит меня в этом мире.'}]},
{nm:'Париж',pd:'Париж · 1886–1887',desc:'Ван Гог переезжает в Париж, живёт с Тео. Открывает импрессионизм, пуантилизм, японские гравюры. Палитра становится яркой. Пишет автопортреты, натюрморты, виды Монмартра.',
 P:[{i:'11-self-portrait-hat.jpg',n:'Автопортрет в серой шляпе',y:'сентябрь–октябрь 1887',d:'масло на хлопке, 44.5 × 37.2 см',loc:'Van Gogh Museum, Amsterdam',s:'44×37',
   l:'Я написал себя точками. Синий и оранжевый, красный и зелёный — как пуантилисты, но по-своему. Глаза горят. Я нанёс короткие полосы краски в разных направлениях. Там, где они следуют за линией головы, они образуют нимб. Это моя самая смелая цветовая работа в Париже. Я продолжаю работать, потому что работа — единственное, что держит меня в этом мире.'},
  {i:'12-portrait-painter.jpg',n:'Автопортрет-художник',y:'1887–1888',d:'холст, масло',loc:'Van Gogh Museum, Amsterdam',s:'—',
   l:'Я пишу себя не таким, какой я есть, а таким, каким мечтаю быть. Потому что легче писать совершенное существо, чем несовершенное. Я пытался написать что-то, что могло бы понравиться. Я — художник. С палитрой, с кистью. В Париже я меняюсь. Краски становятся ярче с каждым днём. Я продолжаю работать, потому что работа — единственное, что держит меня в этом мире.'},
  {i:'13-montmartre.jpg',n:'Вид на Монмартр',y:'1886–1887',d:'холст, масло',loc:'Van Gogh Museum, Amsterdam',s:'—',
   l:'С холма видно весь Париж. Мельницы, крыши, дым. Я пишу это снова и снова — не могу насытиться. Работы французских натуралистов — Золя, Флобера, Мопассана, Гонкура — великолепны. Вряд ли можно сказать, что ты принадлежишь своему времени, если не знаком с ними. Я читаю запоем. Я продолжаю работать, потому что работа — единственное, что держит меня в этом мире.'},
  {i:'14-mackerels.jpg',n:'Скумбрия',y:'1886',d:'холст, масло',loc:'Van Gogh Museum, Amsterdam',s:'—',
   l:'Рыба на столе. Столько оттенков серебра, синего, фиолетового. Париж научил меня видеть цвет. У меня ещё два этюда пейзажей. Надеюсь, работа будет продолжаться стабильно. С тем, что я тебе посылаю, ты должен попытаться обменяться также с Сёра. Пуантилизм — это интересно, но я хочу найти свой путь. Я продолжаю работать, потому что работа — единственное, что держит меня в этом мире.'},
  {i:'15-apples.jpg',n:'Яблоки',y:'1887',d:'холст, масло',loc:'Van Gogh Museum, Amsterdam',s:'—',
   l:'Яблоки как лица — каждое со своим характером. Зелёное, красное, жёлтое — вся палитра на одной тарелке. Изучая законы цвета, можно перейти от инстинктивной веры в великих мастеров к пониманию того, почему нам нравится то, что нам нравится. Цвет — это всё. Я продолжаю работать, потому что работа — единственное, что держит меня в этом мире.'},
  {i:'16-courtesan.jpg',n:'Куртизанка (по Эйсэну)',y:'1887',d:'холст, масло',loc:'Van Gogh Museum, Amsterdam',s:'—',
   l:'Мне не нужны здесь японские гравюры, потому что я постоянно говорю себе: я здесь — в Японии. Мне достаточно открыть глаза и писать то, что производит на меня впечатление. Бабочки, бамбук, яркое кимоно. Этот мир так далёк от Нюэнена. Я скопировал эту гравюру, чтобы понять их секрет. Я продолжаю работать, потому что работа — единственное, что держит меня в этом мире.'}]},
{nm:'Арль',pd:'Арль · 1888–1889',desc:'Ван Гог переезжает в Арль, ищет южное солнце. Пишет подсолнухи, Жёлтый дом, ночные сцены. Гоген приезжает в октябре 1888. После ссоры Ван Гог отрезает себе ухо.',
 P:[{i:'20-sunflowers.jpg',n:'Подсолнухи',y:'август 1888',d:'холст, масло',loc:'Van Gogh Museum, Amsterdam',s:'—',
   l:'Я хочу набить как минимум шесть очень больших холстов в эту крошечную комнату — как японцы. Особенно огромные букеты подсолнухов. Ты знаешь, что японцы инстинктивно ищут контрасты. Я пишу подсолнухи с той же страстью, с какой марсельцы едят буйабес. Это цветок, который обожает солнце — как я. Я продолжаю работать, потому что работа — единственное, что держит меня в этом мире.'},
  {i:'21-bedroom.jpg',n:'Спальня',y:'октябрь 1888',d:'холст, масло',loc:'Van Gogh Museum, Amsterdam',s:'—',
   l:'Сегодня днём я закончил холст спальни. Я хочу, чтобы там были только стулья с соломенными сиденьями, стол и простая кровать. Стены выбелены, пол красный. Но в этой комнате я хочу богатство портретов и живописных этюдов фигур. Стены лиловые, кровать жёлтая — я хотел написать тишину. Я продолжаю работать, потому что работа — единственное, что держит меня в этом мире.'},
  {i:'22-rhone.jpg',n:'Звёздная ночь над Роной',y:'сентябрь 1888',d:'холст, масло',loc:'Van Gogh Museum, Amsterdam',s:'—',
   l:'Я обязательно хочу написать звёздное небо сейчас. Мне часто кажется, что ночь даже богаче цветом, чем день — окрашена в самые интенсивные фиолетовые, синие и зелёные тона. Если присмотреться, одни звёзды лимонные, другие розовые, цвета незабудки. Я сидел на берегу Роны и смотрел, как звёзды отражаются в воде.'},
  {i:'23-cafe-terrace.jpg',n:'Ночное кафе',y:'сентябрь 1888',d:'холст, масло',loc:'Van Gogh Museum, Amsterdam',s:'—',
   l:'Я только что закончил холст интерьера кафе ночью. Несколько бедных ночных бродяг спят в углу. Комната красная, зелёный бильярдный стол отбрасывает огромную тень на пол. В этом холсте шесть или семь разных красных, от кроваво-красного до нежно-розового, в контрасте с таким же количеством зелёных. Я продолжаю работать, потому что работа — единственное, что держит меня в этом мире.'},
  {i:'24-portrait-peasant.jpg',n:'Портрет почтальона',y:'ноябрь 1888',d:'холст, масло',loc:'Van Gogh Museum, Amsterdam',s:'—',
   l:'Рулен — простой человек. Я написал его на жёлтом фоне, как святого. Потому что он и есть святой. Ты будешь рад узнать, что я получил письмо от Жет Мауве с благодарностью за картину. Очень хорошее письмо, в котором она говорит о прошлых временах. У нас пополнение в коллекции портретов художников.'},
  {i:'25-fishing-boats.jpg',n:'Лодки в Сен-Мари',y:'июнь 1888',d:'холст, масло',loc:'Van Gogh Museum, Amsterdam',s:'—',
   l:'Я думал, ты бы взял белые домики под синим небом, которые я сделал в Сен-Мари, на Средиземном море. Я должен был уже вернуться — сейчас там люди на пляже. Но у меня здесь так много дел. За три дня я сделал три картины. Море, лодки, солёный ветер. Работал как одержимый.'}]},
{nm:'Сен-Реми',pd:'Сен-Реми · 1889–1890',desc:'После срыва Ван Гог добровольно ложится в лечебницу Сен-Поль-де-Мозоль. Пишет сад, ирисы, кипарисы, оливковые рощи. Стиль становится экспрессивным — вихревые мазки, яркие цвета.',
 P:[{i:'26-irises.jpg',n:'Ирисы',y:'1889',d:'холст, масло',loc:'Van Gogh Museum, Amsterdam',s:'—',
   l:'Я скоро отправлю два ящика картин. Ты не должен стесняться уничтожить добрую их часть. В саду лечебницы я нашёл ирисы. Они росли сами по себе — дикие, сильные. Если бы ты видел оливковые деревья в это время года — старо-серебряная листва зеленеет на фоне синевы. Это совсем не то, что представляют себе на севере.'},
  {i:'27-self-portrait-bandaged.jpg',n:'Автопортрет',y:'сентябрь 1889',d:'холст, масло',loc:'Van Gogh Museum, Amsterdam',s:'—',
   l:'Я считаю себя глупцом, что иду просить у докторов разрешения писать картины. Но если я поправлюсь, рано или поздно, то лишь потому, что я лечу себя работой. Работа укрепляет волю и не даёт этим душевным слабостям овладеть мной. Смотрю на себя. Взгляд напряжённый. Я не боюсь правды. Я продолжаю работать, потому что работа — единственное, что держит меня в этом мире.'},
  {i:'28-wheatfield-cypresses.jpg',n:'Пшеница и кипарисы',y:'сентябрь 1889',d:'холст, масло',loc:'Van Gogh Museum, Amsterdam',s:'—',
   l:'Вчера я снова начал немного работать. Из окна вижу поле жёлтой стерни, которое пашут. Контраст пурпурной вспаханной земли с полосами жёлтой стерни, на фоне холмов. Кипарисы выше всего на поле. Они как языки пламени. Я пишу их зелёными и чёрными — такими, какими вижу. Работа отвлекает меня бесконечно лучше всего.'},
  {i:'29-olive-trees.jpg',n:'Оливковые деревья',y:'1889',d:'холст, масло',loc:'Van Gogh Museum, Amsterdam',s:'—',
   l:'Старо-серебряная листва зеленеет на фоне синевы. Оранжевая вспаханная земля. Это что-то очень нежное, очень утончённое. Это как подстриженные ивы наших голландских лугов. Шёпот оливковой рощи имеет в себе что-то очень интимное, бесконечно древнее. Оливковое дерево — это как Делакруа. Я продолжаю работать, потому что работа — единственное, что держит меня в этом мире.'},
  {i:'30-hill-montmajour.jpg',n:'Холм Монмажур',y:'1888–1889',d:'холст, масло',loc:'Van Gogh Museum, Amsterdam',s:'—',
   l:'У меня огромное желание уйти в горы и писать целыми днями. Надеюсь, мне позволят в ближайшие дни. Ты скоро увидишь холст с хижиной в горах. Мне было бы хорошо пожить на ферме — там я мог бы сделать хорошую работу. Я поднимался на этот холм много раз. Кельи, камни, пустота.'},
  {i:'31-reaper.jpg',n:'Жнец',y:'сентябрь 1889',d:'холст, масло',loc:'Van Gogh Museum, Amsterdam',s:'—',
   l:'Невозможность иметь модели и куча других вещей мешают мне. В любом случае, я должен стараться быть терпеливым. Маленькая фигура в огромном пшеничном поле. Он жнёт хлеб — я жну образы. Работаем оба до седьмого пота. Если бы я мог начать снова с тем опытом, что у меня сейчас, я бы не поехал на юг.'}]},
{nm:'Овер',pd:'Овер-сюр-Уаз · 1890',desc:'Ван Гог покидает Сен-Реми и переезжает в Овер под присмотр доктора Гаше. Пишет более 70 работ за 70 дней. Поля, портреты, церковь. 29 июля 1890 умирает от огнестрельного ранения.',
 P:[{i:'32-wheatfield-crows.jpg',n:'Пшеничное поле с воронами',y:'июль 1890',d:'холст, масло, 50.5 × 103 см',loc:'Van Gogh Museum, Amsterdam',s:'50×103',
   l:'Я снова взялся за работу — хотя кисть почти выпадала из рук. С тех пор написал три больших холста. Это огромные просторы пшеничных полей под бурным небом, и я пытался выразить печаль, крайнее одиночество. Но также то, что я считаю здоровым и укрепляющим в деревне. Надеюсь, эти холсты скажут тебе то, что я не могу сказать словами.'},
  {i:'33-doctor-gachet.jpg',n:'Доктор Гаше',y:'июнь 1890',d:'холст, масло',loc:'Van Gogh Museum, Amsterdam',s:'—',
   l:'Он сам немного художник. Грустное лицо — как у нас всех. Я написал его в синем, на синем фоне. Мне кажется, сами художники всё больше в бедственном положении. Не прошло ли время заставить их понять пользу объединения? Личная инициатива остаётся неэффективной. Но я продолжаю работать. Я продолжаю работать, потому что работа — единственное, что держит меня в этом мире.'},
  {i:'34-church-auvers.jpg',n:'Церковь в Овере',y:'июнь 1890',d:'холст, масло',loc:'Van Gogh Museum, Amsterdam',s:'—',
   l:'Я сохранил очень хорошие воспоминания о поездке в Париж. Несколько месяцев назад я едва смел надеяться снова увидеть наших друзей. Церковь стоит на холме. Я написал её фиолетовой на тёмно-синем небе. Дорога раздваивается — как моя жизнь. Картина Лотрека, портрет женщины-музыканта, совершенно поразительна. Я продолжаю работать, потому что работа — единственное, что держит меня в этом мире.'},
  {i:'35-undergrowth.jpg',n:'Лесная чаща',y:'июнь 1890',d:'холст, масло',loc:'Van Gogh Museum, Amsterdam',s:'—',
   l:'Два человека идут по лесу. Свет пробивается сквозь листву. Мне нравится писать лес — там тихо. Я прилагаю все усилия к своим холстам. Пытаюсь делать так же хорошо, как некоторые художники, которыми я восхищался. Что касается мира в твоём доме — я верю в возможность его сохранить. Я продолжаю работать, потому что работа — единственное, что держит меня в этом мире.'},
  {i:'36-garden-daubigny.jpg',n:'Сад Добиньи',y:'июль 1890',d:'холст, масло',loc:'Van Gogh Museum, Amsterdam',s:'—',
   l:'Третий холст — сад Добиньи, картина, о которой я думал с тех пор, как здесь. Я заметил с удовольствием, что Гоген из Бретани, который я видел, очень хорош. Сад, полный цветов. Я писал его с крыльца. Зелёный, синий, розовый — цвета, которые я люблю. Это одна из моих самых продуманных картин.'},
  {i:'37-almond-blossom.jpg',n:'Цветущий миндаль',y:'март 1890',d:'холст, масло',loc:'Van Gogh Museum, Amsterdam',s:'—',
   l:'Работа шла хорошо. Последний холст — ветви миндаля в цвету. Возможно, самая терпеливая работа, лучшее, что я сделал. Написанная спокойно и с большей уверенностью мазка. Ветви цветущего миндаля на фоне голубого неба. Я подарил эту картину Тео — в честь рождения его сына. Нашего Винсента. Я продолжаю работать, потому что работа — единственное, что держит меня в этом мире.'}]}
];

let curH=0,obs=[],ang=0,spin=true,lock=false,fi=-1,hi=-1,guided=true,seq=0,doneAll=false;
const f1=document.getElementById('f1'),f2=document.getElementById('f2');
const ctr=document.getElementById('ctr'),nb=document.getElementById('nb'),nx=document.getElementById('next');
function nbClick(){
  if(lock||!document.getElementById('screen').classList.contains('on'))return;
  lock=true;
  if(guided&&fi<0){show(0);seq=0;return;}
  if(guided&&fi>=0){nextPaint();return;}
  if(!guided&&fi>=0){hide(fi);return;}
}
function nextStage(){
  guided=false;doneAll=false;nx.style.display='none';
  const newH=(curH+1)%D.length;
  ctr.classList.add('out');
  obs.forEach((el,i)=>{
    const r=el.getBoundingClientRect();
    el.style.transition='all .8s ease-in';el.style.opacity='0';
    el.style.transform=`translateY(-${innerHeight*1.2}px)`;
  });
  setTimeout(()=>{
    document.getElementById('hc').textContent=`${['I','II','III','IV','V','VI'][newH]} / VI`;
    curH=newH;build(curH);orbit();
  },900);
}
function build(h){
  document.getElementById('cl').textContent=D[h].nm;
  document.getElementById('cn').textContent=D[h].nm;
  document.getElementById('cpd').textContent=D[h].pd;
  document.getElementById('cd').textContent=D[h].desc;
  obs.forEach(e=>e.remove());obs=[];spin=true;fi=-1;hi=-1;lock=false;
  f1.style.display='none';f1.innerHTML='';f1.style.transition='none';
  f2.style.display='none';f2.innerHTML='';f2.style.transition='none';
  ctr.classList.remove('out');nb.style.display='flex';
  const cx=innerWidth/2,cy=innerHeight/2,R=Math.min(innerWidth,innerHeight)*.32;
  D[h].P.forEach((p,i)=>{
    const a=(i/D[h].P.length)*Math.PI*2-Math.PI/2;
    const el=document.createElement('div');el.className='ob';
    el.style.cssText=`left:${cx+R*Math.cos(a)-p.w/2}px;top:${innerHeight*1.2+cy+R*Math.sin(a)-p.h/2}px;width:${p.w}px;height:${p.h}px;opacity:0;`;
    el.innerHTML=`<img src="van-gogh-images/${p.i}">`;
    el.onclick=()=>{
      if(!guided&&!doneAll&&!lock&&fi!==i){lock=true;if(fi>=0)hide(fi);setTimeout(()=>show(i),fi>=0?400:0);}
    };
    document.getElementById('screen').appendChild(el);obs.push(el);
    setTimeout(()=>{
      el.style.transition='all .8s cubic-bezier(.22,1,.36,1)';
      el.style.top=(cy+R*Math.sin(a)-p.h/2)+'px';
      el.style.opacity='1';
    },100+i*100);
  });
}
function orbit(){
  if(!spin){requestAnimationFrame(orbit);return;}
  ang+=.0015;
  const cx=innerWidth/2,cy=innerHeight/2,R=Math.min(innerWidth,innerHeight)*.32;
  obs.forEach((el,i)=>{
    const a=(i/D[curH].P.length)*Math.PI*2-Math.PI/2+ang;
    el.style.left=(cx+R*Math.cos(a)-D[curH].P[i].w/2)+'px';
    el.style.top=(cy+R*Math.sin(a)-D[curH].P[i].h/2)+'px';
    el.style.visibility=(i===fi||i===hi)?'hidden':'';
  });
  requestAnimationFrame(orbit);
}
function show(pi){
  fi=pi;lock=true;
  const p=D[curH].P[pi];
  const r=obs[pi].getBoundingClientRect();
  const fb=(f1.style.display==='block'?f2:f1);
  fb.style.zIndex='11';
  fb.style.display='block';fb.style.transition='none';
  fb.style.filter='brightness(.35) saturate(.25)';
  fb.innerHTML=`<img src="van-gogh-images/${p.i}">`;
  fb.style.left=r.left+'px';fb.style.top=r.top+'px';
  fb.style.width=r.width+'px';fb.style.height=r.height+'px';
  fb.getBoundingClientRect();
  const isMobile=innerWidth<768||'ontouchstart'in window;
  const tw=Math.min(600,innerWidth*.75);
  const mh=innerHeight*.85,ih=Math.min(tw*(p.h/p.w),mh),fw=ih*(p.w/p.h);
  let tl2=(innerWidth-fw)/2,tt2=(innerHeight-ih)/2-20;
  if(isMobile)tt2=innerHeight*0.22;
  fb.style.transition='left 3s ease-out,top 3s ease-out,width 3s ease-out,height 3s ease-out,filter 3s ease-out';
  fb.style.left=tl2+'px';fb.style.top=tt2+'px';
  fb.style.width=fw+'px';fb.style.height=ih+'px';
  fb.style.filter='none';
  ctr.classList.add('out');
  const lp=document.createElement('div'),rp=document.createElement('div');
  lp.className='pp';rp.className='pp';
  const gap=8;
  if(isMobile){
    lp.style.cssText=`position:fixed;z-index:7;pointer-events:none;left:${tl2}px;width:${fw}px;text-align:center;opacity:0;transition:opacity .6s;max-height:42vh;overflow-y:auto;top:${tt2+ih+gap}px;`;
    rp.style.cssText=`position:fixed;z-index:8;pointer-events:none;left:${tl2}px;width:${fw}px;text-align:center;opacity:0;transition:opacity .6s;max-height:18vh;overflow-y:auto;top:${tt2-gap}px;transform:translateY(-100%);`;
    lp.innerHTML=`<div style="font-size:8px;letter-spacing:2px;text-transform:uppercase;color:rgba(196,149,106,.6);margin-bottom:4px">✉ Письмо к Тео</div><div style="font-size:11px;line-height:1.5;color:rgba(255,255,255,.5)">${p.l}</div><div style="font-size:8px;color:rgba(255,255,255,.3);margin-top:4px">— ${p.y}</div>`;
    rp.innerHTML=`<div style="font-size:13px;color:rgba(255,255,255,.9);font-weight:300">${p.n}</div><div style="font-size:8px;color:rgba(255,255,255,.4);letter-spacing:1px;margin:4px 0">${p.y} · ${D[curH].nm}${p.s!=='—'?' · '+p.s:''}</div><div style="font-size:9px;line-height:1.4;color:rgba(255,255,255,.45)"><span style="color:rgba(196,149,106,.85);letter-spacing:1px;text-transform:uppercase;font-size:7px;display:block;margin-bottom:2px">Информация</span>${p.d||''}${p.loc?'<br>'+p.loc:''}</div>`;
  }else{
    lp.style.cssText=`position:fixed;z-index:7;pointer-events:none;opacity:0;transition:opacity .6s .5s;top:50%;transform:translateY(-50%);left:${tl2-284}px;width:260px;`;
    rp.style.cssText=`position:fixed;z-index:7;pointer-events:none;opacity:0;transition:opacity .6s .6s;top:50%;transform:translateY(-50%);left:${tl2+fw+24}px;width:240px;text-align:right;`;
    lp.innerHTML=`<div style="font-size:10px;letter-spacing:3px;text-transform:uppercase;color:rgba(196,149,106,.75);margin-bottom:12px">✉ Письмо к Тео</div><div style="font-size:14px;line-height:1.9;color:rgba(255,255,255,.5);font-weight:300">${p.l}</div><div style="font-size:10px;color:rgba(255,255,255,.45);margin-top:14px;letter-spacing:2px">— ${p.y}</div>`;
    rp.innerHTML=`<div style="height:22px"></div><div style="font-size:18px;color:rgba(255,255,255,.9)">${p.n}</div><div style="font-size:11px;color:rgba(255,255,255,.65);letter-spacing:2px;margin:4px 0 18px">${p.y} · ${D[curH].nm}${p.s!=='—'?' · '+p.s:''}</div><div style="font-size:14px;line-height:1.8;color:rgba(255,255,255,.75);margin-bottom:18px">${p.d||''}</div><div style="font-size:12px;line-height:1.9;color:rgba(255,255,255,.6)"><span style="color:rgba(196,149,106,.85);letter-spacing:2px;text-transform:uppercase;font-size:10px;display:block;margin-bottom:4px">Где находится</span>${p.loc}</div>`;
  }
  document.body.appendChild(lp);document.body.appendChild(rp);
  setTimeout(()=>{lp.style.opacity='1';rp.style.opacity='1';},2800);
  nb.style.display='none';
  setTimeout(()=>{lock=false;},8000);
}
function hide(pi){
  if(pi<0)return;
  hi=pi;
  document.querySelectorAll('.pp').forEach(el=>el.remove());
  ctr.classList.remove('out');
  if(guided)obs[pi].classList.add('done');
  const fa=(f1.style.display==='block'?f1:f2);
  fa.style.zIndex='9';
  fa.style.transition='none';fa.style.filter='none';
  const sr=fa.getBoundingClientRect();
  const dur=2500,start=performance.now();
  (function raf(){
    const p=Math.min(1,(performance.now()-start)/dur);
    const e=1-Math.pow(1-p,3);
    const tr=obs[pi].getBoundingClientRect();
    fa.style.left=(sr.left+(tr.left-sr.left)*e)+'px';
    fa.style.top=(sr.top+(tr.top-sr.top)*e)+'px';
    fa.style.width=(sr.width+(tr.width-sr.width)*e)+'px';
    fa.style.height=(sr.height+(tr.height-sr.height)*e)+'px';
    fa.style.filter=`brightness(${.35+(1-.35)*(1-e)}) saturate(${.25+(1-.25)*(1-e)})`;
    if(p<1)requestAnimationFrame(raf);else{
      fa.style.display='none';fa.innerHTML='';fa.style.filter='';
      hi=-1;
    }
  })();
  nb.style.display='flex';
}
function nextPaint(){
  if(fi<0){show(0);seq=0;return;}
  const ni=seq+1;
  if(ni<D[curH].P.length){
    hide(fi);show(ni);seq=ni;
  }else{
    hide(fi);fi=-1;
    seq=0;guided=false;doneAll=true;
    obs.forEach(el=>el.classList.add('done'));
    nb.style.display='none';
    nx.style.display='block';
  }
}
window.addEventListener('wheel',(e)=>{
  if(!document.getElementById('screen').classList.contains('on')||lock)return;
  if(e.deltaY<0)return;
  e.preventDefault();
  lock=true;setTimeout(nextPaint,50);
},{passive:false});
window.addEventListener('touchend',e=>{
  if(!document.getElementById('screen').classList.contains('on')||lock)return;
  lock=true;setTimeout(nextPaint,50);
},{passive:true});
const c=document.getElementById('bg'),ctx=c.getContext('2d');
let w,h;function rs(){w=c.width=innerWidth;h=c.height=innerHeight}
rs();addEventListener('resize',rs);
let pt=[];for(let i=0;i<60;i++)pt.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.5+.3,vx:(Math.random()-.5)*.1,vy:-(Math.random()*.05+.01),o:Math.random()*.2+.03,p:Math.random()*6.28});
function dr(){ctx.clearRect(0,0,w,h);pt.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.p+=.005;const a=p.o*(.5+.5*Math.sin(p.p));ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fillStyle=`rgba(255,230,210,${a})`;ctx.fill();if(p.y<-10||p.x<-10||p.x>w+10){p.y=Math.random()*h;p.x=Math.random()*w}});requestAnimationFrame(dr)}dr();
setTimeout(()=>{document.getElementById('intro').classList.add('out');document.getElementById('screen').classList.add('on');build(0);guided=true;seq=0;orbit();},3500);
</script>
</body>
